name: Build Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test --configuration Release
      - name: Compute version
        id: version
        shell: bash
        run: |
          base=$(grep -oE '<Version>[0-9]+\.[0-9]+' src/AttendanceAgent/AttendanceAgent.csproj | grep -oE '[0-9]+\.[0-9]+')
          echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - run: dotnet publish src/AttendanceAgent/AttendanceAgent.csproj -c Release -r win-x86 --self-contained -p:PublishSingleFile=true -p:Version=${{ steps.version.outputs.version }} -o publish/attendance-agent
      - run: Compress-Archive -Path publish/attendance-agent/* -DestinationPath publish/attendance-agent-windows.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          prerelease: false
          files: publish/attendance-agent-windows.zip
